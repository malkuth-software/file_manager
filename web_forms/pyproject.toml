[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-forms-compiler"
version = "0.1.0.dev0"
description = "Bounded HTML/CSS to retained C++ descriptor dogfood compiler"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
webforms = "web_forms_compiler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

