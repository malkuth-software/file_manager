<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Web.Forms Button Study</title>
  <link rel="stylesheet" href="button.wf.css">
</head>
<body id="button-study" data-wf-surface="own-surface">
  <main id="button-study.stage" class="control-stage" data-wf-control="panel" data-wf-surface="own-surface">
    <p id="button-study.stage.eyebrow" class="eyebrow">SINGLE CONTROL / 001</p>
    <h1 id="button-study.stage.title">Command button</h1>
    <p id="button-study.stage.description" class="description">A quiet native command with a crisp face, clear focus, and tactile depth.</p>
    <button id="button-study.stage.archive" class="command-button" data-wf-command="archive-selection" data-wf-surface="own-surface">
      Archive selection
    </button>
    <small id="button-study.stage.hint" class="hint">Enter activates · Escape leaves the surface unchanged</small>
  </main>
</body>
</html>
