<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Web.Forms Breadcrumb Study</title>
  <link rel="stylesheet" href="breadcrumb.wf.css">
</head>
<body id="breadcrumb-study" data-wf-surface="own-surface">
  <main id="breadcrumb-study.stage" class="widget-stage" data-wf-control="panel" data-wf-surface="own-surface">
    <header id="breadcrumb-study.stage.heading" class="study-heading">
      <p id="breadcrumb-study.stage.heading.eyebrow" class="eyebrow">COMPOUND WIDGET / 001</p>
      <h1 id="breadcrumb-study.stage.heading.title">Location history</h1>
    </header>
    <nav id="breadcrumb-study.stage.path" class="breadcrumb" data-wf-control="breadcrumb" data-wf-surface="own-surface" aria-label="Current location">
      <button id="breadcrumb-study.stage.path.computer" class="crumb" data-wf-command="open-computer" data-wf-surface="own-surface">Computer</button>
      <button id="breadcrumb-study.stage.path.projects" class="crumb" data-wf-command="open-projects" data-wf-surface="own-surface">Projects</button>
      <button id="breadcrumb-study.stage.path.aurora" class="crumb current" data-wf-command="open-aurora" data-wf-surface="own-surface">Aurora</button>
    </nav>
    <section id="breadcrumb-study.stage.recent" class="history" data-wf-surface="own-surface">
      <p id="breadcrumb-study.stage.recent.label" class="history-title">Recent locations</p>
      <button id="breadcrumb-study.stage.recent.one" class="history-row" data-wf-command="open-recent-one" data-wf-surface="own-surface">Reference captures</button>
      <button id="breadcrumb-study.stage.recent.two" class="history-row" data-wf-command="open-recent-two" data-wf-surface="own-surface">Interface studies</button>
      <button id="breadcrumb-study.stage.recent.three" class="history-row" data-wf-command="open-recent-three" data-wf-surface="own-surface">Sapphire exports</button>
    </section>
  </main>
</body>
</html>
