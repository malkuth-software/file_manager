name: JPEG research correctness
on:
  push:
    branches: [main]
    paths:
      - 'frontend/experiments/jpeg_decode/**'
      - 'backend'
      - '.github/workflows/jpeg-research.yml'
  pull_request:
    paths:
      - 'frontend/experiments/jpeg_decode/**'
      - 'backend'
      - '.github/workflows/jpeg-research.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jpeg-research-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check authored C++ spelling
        run: |
          python tools/check_house_style.py frontend/experiments/jpeg_decode
      - name: Fetch exact color source
        run: cmake -DCOLOR_DOWNLOAD_ROOT=.build/jpeg-color-source -P frontend/experiments/jpeg_decode/fetch_color.cmake
      - name: Build independent color package without plugins
        run: |
          cmake -S .build/jpeg-color-source/lcms2-2.19.1 -B .build/jpeg-color-build -DCMAKE_BUILD_TYPE=Release -DLCMS2_BUILD_SHARED=OFF -DLCMS2_BUILD_STATIC=ON -DLCMS2_BUILD_TOOLS=OFF -DLCMS2_BUILD_TESTS=OFF -DLCMS2_WITH_FASTFLOAT=OFF -DLCMS2_WITH_THREADED_PLUGIN=OFF -DCMAKE_INSTALL_LIBDIR=lib "-DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/.build/jpeg-color"
          cmake --build .build/jpeg-color-build --config Release --parallel 2
          cmake --install .build/jpeg-color-build --config Release
      - name: Fetch exact codec source
        run: cmake -DCODEC_DOWNLOAD_ROOT=.build/jpeg-codec-source -P frontend/experiments/jpeg_decode/fetch_codec.cmake
      - name: Build independent scalar codec package
        run: |
          cmake -S .build/jpeg-codec-source/libjpeg-turbo-3.2.0 -B .build/jpeg-codec-build -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DWITH_SIMD=OFF -DWITH_TOOLS=OFF -DWITH_TESTS=OFF -DWITH_TURBOJPEG=ON -DCMAKE_INSTALL_LIBDIR=lib "-DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/.build/jpeg-codec"
          cmake --build .build/jpeg-codec-build --config Release --parallel 2
          cmake --install .build/jpeg-codec-build --config Release
      - name: Build bounded metadata and pixel checks
        run: |
          cmake -S frontend/experiments/jpeg_decode -B .build/jpeg-research -DCMAKE_BUILD_TYPE=Release -DFILE_MANAGER_JPEG_CMAKE_PACKAGE=ON "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/.build/jpeg-codec;$GITHUB_WORKSPACE/.build/jpeg-color"
          cmake --build .build/jpeg-research --config Release --parallel 2
      - name: Verify correctness without timing claims
        run: ctest --test-dir .build/jpeg-research -C Release --output-on-failure --timeout 60
      - name: Build independent minimum-version frame consumer
        run: |
          rustup toolchain install 1.87.0 --profile minimal --component rustfmt --component clippy
          cargo +1.87.0 fmt --manifest-path backend/orchestrator/experiments/preview_frame/Cargo.toml -- --check
          cargo +1.87.0 clippy --manifest-path backend/orchestrator/experiments/preview_frame/Cargo.toml --locked --offline --all-targets --all-features --jobs 2 --target-dir backend/orchestrator/.build/preview-frame -- -D warnings
          cargo +1.87.0 build --manifest-path backend/orchestrator/experiments/preview_frame/Cargo.toml --locked --offline --bin check_jpeg --jobs 2 --target-dir backend/orchestrator/.build/preview-frame
      - name: Verify real JPEG pixels across process bytes
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            jpeg_producer=.build/jpeg-research/Release/file_manager_jpeg_experiment.exe
            jpeg_decoder=.build/jpeg-research/Release/file_manager_jpeg_decoder.exe
            jpeg_consumer=backend/orchestrator/.build/preview-frame/debug/check_jpeg.exe
          else
            jpeg_producer=.build/jpeg-research/file_manager_jpeg_experiment
            jpeg_decoder=.build/jpeg-research/file_manager_jpeg_decoder
            jpeg_consumer=backend/orchestrator/.build/preview-frame/debug/check_jpeg
          fi
          for orientation in 1 2 3 4 5 6 7 8; do
            "$jpeg_producer" --emit-frame "$orientation" | "$jpeg_consumer" "$orientation" plain
            "$jpeg_producer" --emit-color-frame "$orientation" | "$jpeg_consumer" "$orientation" linear
            "$jpeg_producer" --emit-encoded "$orientation" | "$jpeg_decoder" | "$jpeg_consumer" "$orientation" plain
            "$jpeg_producer" --emit-color-encoded "$orientation" | "$jpeg_decoder" | "$jpeg_consumer" "$orientation" linear
          done
          python frontend/experiments/jpeg_decode/verify_decoder_input.py "$jpeg_producer" "$jpeg_decoder"
      - name: Verify bounded Rust process supervision
        run: |
          set -euo pipefail
          cargo +1.87.0 fetch --manifest-path backend/orchestrator/experiments/preview_supervision/Cargo.toml --locked
          cargo +1.87.0 fmt --manifest-path backend/orchestrator/experiments/preview_supervision/Cargo.toml -- --check
          cargo +1.87.0 clippy --manifest-path backend/orchestrator/experiments/preview_supervision/Cargo.toml --locked --offline --all-targets --all-features --jobs 2 --target-dir backend/orchestrator/.build/preview-supervision -- -D warnings
          cargo +1.87.0 test --manifest-path backend/orchestrator/experiments/preview_supervision/Cargo.toml --locked --offline --jobs 2 --target-dir backend/orchestrator/.build/preview-supervision -- --nocapture --test-threads=1
          if [ "$RUNNER_OS" = Windows ]; then
            jpeg_producer=.build/jpeg-research/Release/file_manager_jpeg_experiment.exe
            jpeg_decoder=.build/jpeg-research/Release/file_manager_jpeg_decoder.exe
            jpeg_supervisor=backend/orchestrator/.build/preview-supervision/debug/check_decoder.exe
          else
            jpeg_producer=.build/jpeg-research/file_manager_jpeg_experiment
            jpeg_decoder=.build/jpeg-research/file_manager_jpeg_decoder
            jpeg_supervisor=backend/orchestrator/.build/preview-supervision/debug/check_decoder
          fi
          "$jpeg_producer" --emit-encoded 1 > .build/supervised-jpeg-envelope.bin
          "$jpeg_supervisor" "$jpeg_decoder" .build/supervised-jpeg-envelope.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpeg-research-${{ matrix.os }}-${{ github.sha }}
          path: |
            .build/jpeg-research/Testing/Temporary/LastTest.log
            .build/jpeg-research/CMakeCache.txt
            .build/jpeg-codec-build/CMakeCache.txt
            .build/jpeg-color-build/CMakeCache.txt
          if-no-files-found: warn
