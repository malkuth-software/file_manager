name: File Manager development builds
# The toolkit is compiled exactly as GUI.Forms CI compiles it: the same pinned
# LLVM 22.1.8 per platform, the same runner images, gui_forms/ beside
# .build/native-<platform>/gui-forms/ under one CCACHE_BASEDIR, and its own
# tools/ci_build.py. The pinned provider's published object cache therefore
# hits here (gui_forms docs/building/reusing-ci-caches.md, "Copying the
# method"). A hit is never test acceptance: every toolkit and frontend test
# still runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mac_cpu_profile:
        description: Capture separate focused and cleared Mac CPU profiles with controls
        type: boolean
        required: false
        default: false
      mac_cpu_profile_template:
        description: Explicit profiler for a separately recorded attempt
        type: choice
        required: false
        default: auto
        options:
          - auto
          - CPU Profiler
          - Time Profiler
permissions:
  contents: read
concurrency:
  # A newer push to a branch cancels its older run; a push to main waits for
  # the previous main run, whose cache saves the next one restores. Manual
  # diagnostics have their own group and never cancel a pushed commit's checks.
  group: native-${{ github.event_name == 'workflow_dispatch' && 'manual-' || '' }}${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  house-style:
    name: House-style spelling and lifetime checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The pinned provider's checkers, so File Manager is held to the rules
      # GUI.Forms applies to itself (planning/PROGRAMMING_HOUSE_STYLE.md
      # sections 2, 5, 9 and 10). They check spelling and two lifetime rules
      # only; ownership, ordering and naming still need source review.
      - name: Check first-party C++ against the provider's checkers
        run: |
          python3 -B gui_forms/tools/check_house_style.py frontend/include frontend/src frontend/tests frontend/examples frontend/experiments backend/orchestrator/conformance/clients/cpp
          python3 -B gui_forms/tools/check_lifetime_rules.py frontend/include frontend/src frontend/tests frontend/examples frontend/experiments backend/orchestrator/conformance/clients/cpp
      - name: Test the build tooling
        run: |
          python3 -B tools/backend_bundle_tests.py
          python3 -B tools/compiler_seed_tests.py
          python3 -B tools/native_build_tests.py
          python3 -B tools/export_native_sdks_tests.py
  native:
    name: ${{ matrix.platform }}
    needs: house-style
    strategy:
      fail-fast: false
      matrix:
        include:
          # The provider's runner images: the macOS SDK and the Windows msys64
          # location enter the compiler-cache hash.
          - runner: macos-15
            platform: macos-arm64
            shell: bash
          - runner: ubuntu-24.04
            platform: linux-x64
            shell: bash
          - runner: windows-2022
            platform: windows-x64
            shell: 'msys2 {0}'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      GUI_FORMS_RUNNER: ${{ matrix.runner }}
      OBJCXX: clang++
      CC: clang
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Preserve Windows checkout line-ending policy across Git implementations
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Checkout uses Git for Windows; the build uses MSYS Git, whose
          # separate system config otherwise misreports CRLF files as changed.
          git config --local core.autocrlf true
          git submodule foreach --recursive git config --local core.autocrlf true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Stdlib zstd extracts the Windows toolchain; the build keeps its own Python.
      - uses: actions/setup-python@v5
        id: toolchain-python
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
          update-environment: false
      # The provider's published MSYS2 CLANG64 tree, extracted at the
      # producer's msys root; never the current MSYS2 mirror packages. The
      # tool names its release repository through GITHUB_REPOSITORY.
      - name: Restore the provider's pinned Windows toolchain
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
        run: GITHUB_REPOSITORY=malkuth-software/gui_forms "$TOOLCHAIN_PYTHON" gui_forms/tools/windows_toolchain.py restore
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install cmake ninja ccache llvm@22
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
          echo "GUI_FORMS_LLVM_RUNTIME=$PWD/.build/toolchain/llvm-22.1.8-macos14" >> "$GITHUB_ENV"
      - name: Name the Linux package cache
        id: linux-image
        if: runner.os == 'Linux'
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: linux-packages
        if: runner.os == 'Linux'
        with:
          path: ${{ runner.temp }}/apt-archives
          key: file-manager-debs-v1-${{ runner.arch }}-${{ hashFiles('gui_forms/tools/install_linux_ci_packages.sh') }}-${{ steps.linux-image.outputs.image }}
          restore-keys: file-manager-debs-v1-${{ runner.arch }}-${{ hashFiles('gui_forms/tools/install_linux_ci_packages.sh') }}-
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sh gui_forms/tools/install_linux_ci_packages.sh toolkit "$RUNNER_TEMP/apt-archives"
      - uses: actions/cache/save@v4
        if: runner.os == 'Linux' && github.event_name != 'pull_request' && steps.linux-packages.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.linux-packages.outputs.cache-primary-key }}
      - name: Identify and verify the LLVM 22.1.8 compiler
        id: compiler
        run: python gui_forms/tools/compiler_identity.py
      - name: Configure compiler cache
        run: |
          cache_dir="$PWD/.ccache"
          cache_base="$PWD"
          if command -v cygpath >/dev/null; then
            cache_dir="$(cygpath -m "$cache_dir")"
            cache_base="$(cygpath -m "$cache_base")"
          fi
          {
            echo "CCACHE_DIR=$cache_dir"
            echo "CCACHE_BASEDIR=$cache_base"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_MAXSIZE=500M"
            # Before any cache is restored: ci_cache.py evict keeps the
            # entries used after this moment.
            echo "GUI_FORMS_JOB_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      # Main's own objects first; pull requests restore main's and never save.
      - uses: actions/cache/restore@v4
        id: objects
        with:
          path: .ccache
          key: file-manager-objects-v2-${{ matrix.platform }}-${{ steps.compiler.outputs.identity }}-${{ github.sha }}
          restore-keys: |
            file-manager-objects-v2-${{ matrix.platform }}-${{ steps.compiler.outputs.identity }}-
      # The pinned toolkit's tested objects (and the macOS runtime) are merged
      # over them; a missing seed only means ordinary compilation.
      - name: Fetch the pinned backend bundle and toolkit compiler cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/fetch_build_inputs.py --platform ${{ matrix.platform }}
      - name: Build or verify the macOS 14 LLVM runtime
        if: runner.os == 'macOS'
        run: |
          if [ ! -f "$GUI_FORMS_LLVM_RUNTIME/runtime-manifest.json" ]; then
            python gui_forms/tools/build_macos_runtimes.py --work "$RUNNER_TEMP/llvm-runtimes" --prefix "$GUI_FORMS_LLVM_RUNTIME" --jobs 4
          fi
          python gui_forms/tools/macos_runtime_manifest.py "$GUI_FORMS_LLVM_RUNTIME"
          python gui_forms/tools/audit_macos_minimum.py "$GUI_FORMS_LLVM_RUNTIME/lib"
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: |
            gui_forms/third_party/skia
            gui_forms/third_party/harfbuzz
            gui_forms/third_party/freetype
            gui_forms/third_party/libunibreak
            .build/native-${{ matrix.platform }}/gui-forms/_deps/gui_forms_miniaudio-src
            .build/native-${{ matrix.platform }}/skia
          key: file-manager-deps-v2-${{ matrix.platform }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('gui_forms/third_party/*.sh', 'gui_forms/third_party/*.patch', 'gui_forms/third_party/*.gn', 'gui_forms/cmake/Audio.cmake') }}
      - name: Check reference search behavior and listener ownership
        shell: bash
        run: node gui_forms/tests/api_reference_search_tests.js
      - name: Test the build tooling on this platform
        run: |
          python -B tools/backend_bundle_tests.py
          python -B tools/compiler_seed_tests.py
          python -B tools/native_build_tests.py
          python -B gui_forms/tests/verify_install_tests.py
      - name: Build, test and package
        run: |
          ccache --zero-stats
          if [ "$RUNNER_OS" = Linux ]; then
            # Native lifecycle tests close and reopen the last X11 connection.
            # Keep the test server alive without its automatic last-client reset.
            xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" python tools/build_native.py --jobs 4
          else
            python tools/build_native.py --jobs 4
          fi
      # House style section 5: memory errors and undefined behaviour are
      # defects, tests included. The frontend suite runs under ASan, UBSan and
      # LSan against the tested Release SDK; any report fails the job.
      - name: Test the frontend under the sanitizers
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" python tools/build_native.py --sanitize --jobs 4
      - name: Export the verified matching native SDKs
        run: |
          python -B tools/export_native_sdks_tests.py
          python -B tools/export_native_sdks.py
      - name: Measure consumer image admission
        run: |
          set -euo pipefail
          build=.build/native-${{ matrix.platform }}
          python frontend/experiments/preview_admission/fixture.py "$build/preview-admission/data"
          cmake -S frontend/experiments/preview_admission -B "$build/preview-admission/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$PWD/gui_forms/cmake/llvm22.cmake" -DCMAKE_PREFIX_PATH="$PWD/$build/gui-forms-sdk"
          cmake --build "$build/preview-admission/build" --parallel 4
          "$build/preview-admission/build/preview_admission" "$build/preview-admission/data" | tee "$build/preview-admission/forward.log"
          "$build/preview-admission/build/preview_admission" "$build/preview-admission/data" --reverse | tee "$build/preview-admission/reverse.log"
      - name: Build matching Release symbols for optional Mac CPU profiling
        id: mac-profile-build
        if: always() && runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.mac_cpu_profile
        timeout-minutes: 10
        run: |
          set -euo pipefail
          profile_build="$PWD/.build/native-macos-arm64/cpu-profile-build"
          profile_evidence="$PWD/.build/native-macos-arm64/cpu-profile"
          mkdir -p "$profile_evidence/symbols"
          cmake -S gui_forms -B "$profile_build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/gui_forms/cmake/llvm22.cmake" \
            '-DCMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG -g' \
            '-DCMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG -g' \
            '-DCMAKE_OBJCXX_FLAGS_RELEASE=-O3 -DNDEBUG -g' \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DGUI_FORMS_BUILD_GALLERY=OFF -DGUI_FORMS_BUILD_TESTS=ON \
            -DGUI_FORMS_ENABLE_MACOS_HOST=ON -DGUI_FORMS_ENABLE_WINDOWS_HOST=OFF -DGUI_FORMS_ENABLE_LINUX_HOST=OFF \
            -DGUI_FORMS_ENABLE_SKIA=ON -DGUI_FORMS_ENABLE_HARFBUZZ_TEXT=ON \
            -DGUI_FORMS_BUILD_PREPARED_TEXT=OFF -DGUI_FORMS_BUILD_TEXT_MASKS=OFF \
            -DGUI_FORMS_SKIA_PREBUILT=ON -DGUI_FORMS_SKIA_OUT="$PWD/.build/native-macos-arm64/skia" \
            2>&1 | tee "$profile_evidence/configure.log"
          cmake --build "$profile_build" --target gui_forms_macos_idle_visibility_tests --parallel 4 \
            2>&1 | tee "$profile_evidence/build.log"
          profile_app="$profile_build/gui_forms_macos_idle_visibility_tests.app"
          profile_executable="$profile_app/Contents/MacOS/gui_forms_macos_idle_visibility_tests"
          profile_symbols="$profile_evidence/symbols/gui_forms_macos_idle_visibility_tests.dSYM"
          xcrun dsymutil "$profile_executable" -o "$profile_symbols"
          xcrun dwarfdump --uuid "$profile_executable" > "$profile_evidence/symbols/executable-uuid.txt"
          xcrun dwarfdump --uuid "$profile_symbols" > "$profile_evidence/symbols/dsym-uuid.txt"
          test "$(awk '{print $2}' "$profile_evidence/symbols/executable-uuid.txt")" = "$(awk '{print $2}' "$profile_evidence/symbols/dsym-uuid.txt")"
          ditto "$profile_app" "$profile_evidence/symbols/gui_forms_macos_idle_visibility_tests.app"
          shasum -a 256 "$profile_executable" > "$profile_evidence/symbols/executable-sha256.txt"
      - name: Capture optional Mac CPU profiles and unprofiled controls
        if: always() && runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.mac_cpu_profile && steps.mac-profile-build.outcome == 'success'
        timeout-minutes: 20
        continue-on-error: true
        env:
          MAC_CPU_PROFILE_TEMPLATE: ${{ inputs.mac_cpu_profile_template }}
        run: |
          if [ "$MAC_CPU_PROFILE_TEMPLATE" = auto ] || [ -z "$MAC_CPU_PROFILE_TEMPLATE" ]; then
            python3 -B tools/run_macos_cpu_profile.py
          else
            python3 -B tools/run_macos_cpu_profile.py --template "$MAC_CPU_PROFILE_TEMPLATE"
          fi
      - name: Preserve optional Mac CPU profiles and matching symbols
        if: always() && runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.mac_cpu_profile
        uses: actions/upload-artifact@v4
        with:
          name: mac-cpu-profile-${{ github.run_id }}
          path: .build/native-macos-arm64/cpu-profile/
          include-hidden-files: true
          retention-days: 20
          if-no-files-found: warn
      - name: Report compiler cache statistics
        if: always()
        run: |
          ccache --show-stats --verbose
          mkdir -p .build/native-${{ matrix.platform }}
          ccache --print-stats > .build/native-${{ matrix.platform }}/compiler-cache-stats.txt
      # Only main saves caches: a pull request's entries could be restored by
      # no other ref and evicted main's from the repository's 10 GB. The saved
      # object cache is this build's working set, not every generation.
      - uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.dependencies.outputs.cache-primary-key != '' && steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            gui_forms/third_party/skia
            gui_forms/third_party/harfbuzz
            gui_forms/third_party/freetype
            gui_forms/third_party/libunibreak
            .build/native-${{ matrix.platform }}/gui-forms/_deps/gui_forms_miniaudio-src
            .build/native-${{ matrix.platform }}/skia
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Keep only the compiler cache entries this build used
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python gui_forms/tools/ci_cache.py evict --since "$GUI_FORMS_JOB_START"
      - uses: actions/cache/save@v4
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.objects.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: ${{ steps.objects.outputs.cache-primary-key }}
      - name: Upload verified development archive
        uses: actions/upload-artifact@v4
        with:
          name: file-manager-${{ matrix.platform }}
          path: |
            .build/native-${{ matrix.platform }}/dist/*.zip
            .build/native-${{ matrix.platform }}/dist/*.tar.gz
            .build/native-${{ matrix.platform }}/dist/*.sha256
          if-no-files-found: error
      - name: Upload verified matching native SDKs
        uses: actions/upload-artifact@v4
        with:
          name: gui-forms-picker-sdk-${{ matrix.platform }}
          path: |
            .build/native-${{ matrix.platform }}/sdk-dist/*.zip
            .build/native-${{ matrix.platform }}/sdk-dist/*.sha256
          if-no-files-found: error
      - name: Preserve build/test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ matrix.platform }}
          path: |
            .build/native-${{ matrix.platform }}/**/Testing/Temporary/*LastTest.log
            .build/native-${{ matrix.platform }}/**/CMakeConfigureLog.yaml
            .build/native-${{ matrix.platform }}/compiler-cache-stats.txt
            .build/native-${{ matrix.platform }}/backend-consumption.json
            .build/native-${{ matrix.platform }}/gui-forms-consumption.json
            .build/native-${{ matrix.platform }}/package-check.json
            .build/native-${{ matrix.platform }}/source-state-*.json
            .build/native-${{ matrix.platform }}/paint-cost/*
            .build/native-${{ matrix.platform }}/focused-cpu/*
            .build/native-${{ matrix.platform }}/preview-admission/*.log
            .build/native-${{ matrix.platform }}/frontend/native-preview-failure.png
            .build/native-${{ matrix.platform }}/frontend/native-preview-failure.json
            .build/native-${{ matrix.platform }}/frontend/native-details.png
            .build/native-${{ matrix.platform }}/frontend/native-selection-facts.png
            .build/native-${{ matrix.platform }}/frontend/native-text-preview.png
            .build/native-${{ matrix.platform }}/frontend/native-image-preview.png
            .build/native-${{ matrix.platform }}/frontend/native-local-actions.png
            cache-manifest.json
          if-no-files-found: ignore
  # After the saving jobs of a push to main: delete the cache entries each new
  # save superseded, keeping the newest of each family (gui_forms
  # tools/ci_cache.py prune). The only job with actions: write.
  cache-prune:
    needs: native
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Delete superseded cache generations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B gui_forms/tools/ci_cache.py prune --ref refs/heads/main --apply
