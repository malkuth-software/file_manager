name: File Manager development builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mac_cpu_profile:
        description: Capture separate focused and cleared Mac CPU profiles with controls
        type: boolean
        required: false
        default: false
      mac_cpu_profile_template:
        description: Explicit profiler for a separately recorded attempt
        type: choice
        required: false
        default: auto
        options:
          - auto
          - CPU Profiler
          - Time Profiler
permissions:
  contents: read
concurrency:
  # Manual diagnostics must not cancel the checks attached to a pushed commit.
  # PR checks validate the merge ref independently of branch and manual builds.
  group: native-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  house-style:
    name: House-style spelling regression checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify scanner fixtures and corrected C++ consumer scope
        run: |
          python3 -B -m unittest discover -s tools -p test_house_style.py
          python3 -B tools/check_house_style.py frontend/include frontend/src frontend/tests frontend/examples backend/orchestrator/conformance/clients/cpp
          python3 -B tools/check_house_style.py gui_forms/src/host/windows/input/windows_message_queue.hpp gui_forms/tests/windows_message_queue_tests.cpp gui_forms/tests/windows_message_queue_native_probe.cpp
          python3 -B tools/check_house_style.py gui_forms/include/gui_forms/text_mask.hpp gui_forms/include/gui_forms/text_mask gui_forms/src/core/text/text_mask gui_forms/src/render/text/text_mask gui_forms/tests/text_mask_lifecycle_tests.cpp gui_forms/tests/text_mask_native_tests.cpp gui_forms/tests/text_mask_wrapping_tests.cpp gui_forms/tests/text_mask_cost_probe.cpp
          python3 -B tools/check_house_style.py gui_forms/src/core/text/prepared_window gui_forms/tests/prepared_window_input_tests.cpp gui_forms/tests/prepared_window_batch_tests.cpp
          python3 -B tools/check_house_style.py gui_forms/src/render/text/harfbuzz/harfbuzz_font_engine.hpp gui_forms/src/render/text/harfbuzz/harfbuzz_font_engine.cpp
          python3 -B tools/check_house_style.py gui_forms/include/gui_forms/component/component/component.hpp gui_forms/src/core/component/component/component.cpp gui_forms/include/gui_forms/event/event/event.hpp gui_forms/include/gui_forms/event/subscription_token/subscription_token.hpp gui_forms/tests/owned_event_tests.cpp gui_forms/examples/reference/owned_events.cpp gui_forms/tools/owned_event_lab.cpp
          python3 -B tools/check_house_style.py gui_forms/src/render/text/prepared_window_shape.hpp gui_forms/src/render/text/prepared_window_shape.cpp gui_forms/tests/prepared_window_shape_tests.cpp gui_forms/src/render/text/prepared_window_session.hpp gui_forms/src/render/text/prepared_window_session.cpp gui_forms/tests/prepared_window_session_tests.cpp gui_forms/src/core/text/prepared/prepared_storage.hpp gui_forms/src/core/text/prepared/prepared_storage.cpp gui_forms/src/render/text/prepared_service.cpp gui_forms/tests/prepared_text_service_tests.cpp
  native:
    name: ${{ matrix.platform }}
    needs: house-style
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: macos-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CC: clang
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Preserve Windows checkout line-ending policy across Git implementations
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Checkout uses Git for Windows; the build uses MSYS Git, whose
          # separate system config otherwise misreports CRLF files as changed.
          git config --local core.autocrlf true
          git submodule foreach --recursive git config --local core.autocrlf true
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja ccache
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04's default Clang 18 rejects the existing in-class
          # friend exception specifications. Use the LLVM 22 release series.
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm-key.asc" /usr/share/keyrings/apt-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/apt-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache clang-22 generate-ninja pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libatk1.0-dev libatk-bridge2.0-dev xvfb xauth xdg-utils
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-ccache git
      - name: Identify Windows Clang toolchain
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test "$MSYSTEM" = CLANG64
          test "$(command -v clang)" = /clang64/bin/clang
          test "$(command -v clang++)" = /clang64/bin/clang++
          clang --version
          clang++ --version
          ld.lld --version
          export FILE_MANAGER_CLANG_BIN="$(cygpath -w /clang64/bin)"
          pwsh -NoProfile -Command '. ./tools/Enter-WindowsToolchain.ps1; & $env:CXX --version; if ($LASTEXITCODE -ne 0) { throw "Clang invocation failed" }'
      - name: Configure compiler cache on macOS and Linux
        if: runner.os != 'Windows'
        run: |
          # shellcheck disable=SC2129
          echo "CCACHE_DIR=$PWD/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$PWD" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
      - name: Configure compiler cache on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # shellcheck disable=SC2129
          echo "CCACHE_DIR=$(cygpath -m "$PWD/.ccache")" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$(cygpath -m "$PWD")" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: objects
        with:
          path: .ccache
          key: file-manager-objects-v1-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: file-manager-objects-v1-${{ matrix.platform }}-
      - name: Fetch pinned backend and toolkit cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.objects.outputs.cache-hit }}" = true ]; then
            python3 tools/fetch_build_inputs.py --platform ${{ matrix.platform }} --skip-cache
          else
            python3 tools/fetch_build_inputs.py --platform ${{ matrix.platform }}
          fi
      - name: Check reference search behavior and listener ownership
        shell: bash
        run: node gui_forms/tests/api_reference_search_tests.js
      - name: Identify dependency compiler
        id: dependency-compiler
        if: runner.os != 'Windows'
        shell: bash
        run: python3 tools/native_compiler_identity.py
      - name: Restore pinned source and Skia build cache
        id: native-dependencies
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: |
            gui_forms/third_party/skia
            gui_forms/third_party/harfbuzz
            gui_forms/third_party/freetype
            .build/native-${{ matrix.platform }}/skia
          key: native-deps-v1-${{ matrix.platform }}-${{ steps.dependency-compiler.outputs.identity }}-${{ hashFiles('gui_forms/third_party/fetch_skia_cpu.sh', 'gui_forms/third_party/fetch_text_stack.sh', 'gui_forms/third_party/build_skia_cpu*.sh', 'gui_forms/third_party/skia*.patch', 'gui_forms/third_party/skia_cpu_args.gn', 'tools/build_native.py', 'tools/native_build_support.py') }}
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ccache --zero-stats
          python -B tools/backend_bundle_tests.py
          python3 -B tools/compiler_seed_tests.py
          python -B tools/native_build_tests.py
          python -B gui_forms/tests/verify_install_tests.py
          python tools/build_native.py --jobs 4
          python -B tools/export_native_sdks_tests.py
          python -B tools/export_native_sdks.py
      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          ccache --zero-stats
          python3 -B tools/backend_bundle_tests.py
          python3 -B tools/compiler_seed_tests.py
          python3 -B tools/native_build_tests.py
          python3 -B gui_forms/tests/verify_install_tests.py
          python3 tools/build_native.py --jobs 4
          python3 -B tools/export_native_sdks_tests.py
          python3 -B tools/export_native_sdks.py
      - name: Build Linux with test display
        if: runner.os == 'Linux'
        run: |
          ccache --zero-stats
          python3 -B tools/backend_bundle_tests.py
          python3 -B tools/compiler_seed_tests.py
          python3 -B tools/native_build_tests.py
          python3 -B gui_forms/tests/verify_install_tests.py
          # Native lifecycle tests close and reopen the last X11 connection.
          # Keep the test server alive without its automatic last-client reset.
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" python3 tools/build_native.py --jobs 4
          python3 -B tools/export_native_sdks_tests.py
          python3 -B tools/export_native_sdks.py
      - name: Verify installed owner-held event example on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S gui_forms/examples/reference -B .build/native-${{ matrix.platform }}/owned-events -G Ninja -DCMAKE_BUILD_TYPE=Release -DGUIForms_DIR="$PWD/.build/native-${{ matrix.platform }}/gui-forms-sdk/lib/cmake/GUIForms"
          cmake --build .build/native-${{ matrix.platform }}/owned-events --parallel 4
          ctest --test-dir .build/native-${{ matrix.platform }}/owned-events --output-on-failure
      - name: Verify installed owner-held event example on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S gui_forms/examples/reference -B .build/native-${{ matrix.platform }}/owned-events -G Ninja -DCMAKE_BUILD_TYPE=Release -DGUIForms_DIR="$PWD/.build/native-${{ matrix.platform }}/gui-forms-sdk/lib/cmake/GUIForms"
          cmake --build .build/native-${{ matrix.platform }}/owned-events --parallel 4
          ctest --test-dir .build/native-${{ matrix.platform }}/owned-events --output-on-failure
      - name: Measure consumer image admission on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python frontend/experiments/preview_admission/fixture.py .build/native-${{ matrix.platform }}/preview-admission/data
          cmake -S frontend/experiments/preview_admission -B .build/native-${{ matrix.platform }}/preview-admission/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGUIForms_DIR="$PWD/.build/native-${{ matrix.platform }}/gui-forms-sdk/lib/cmake/GUIForms"
          cmake --build .build/native-${{ matrix.platform }}/preview-admission/build --parallel 4
          .build/native-${{ matrix.platform }}/preview-admission/build/preview_admission.exe .build/native-${{ matrix.platform }}/preview-admission/data | tee .build/native-${{ matrix.platform }}/preview-admission/forward.log
          .build/native-${{ matrix.platform }}/preview-admission/build/preview_admission.exe .build/native-${{ matrix.platform }}/preview-admission/data --reverse | tee .build/native-${{ matrix.platform }}/preview-admission/reverse.log
      - name: Measure consumer image admission on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 frontend/experiments/preview_admission/fixture.py .build/native-${{ matrix.platform }}/preview-admission/data
          cmake -S frontend/experiments/preview_admission -B .build/native-${{ matrix.platform }}/preview-admission/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGUIForms_DIR="$PWD/.build/native-${{ matrix.platform }}/gui-forms-sdk/lib/cmake/GUIForms"
          cmake --build .build/native-${{ matrix.platform }}/preview-admission/build --parallel 4
          .build/native-${{ matrix.platform }}/preview-admission/build/preview_admission .build/native-${{ matrix.platform }}/preview-admission/data | tee .build/native-${{ matrix.platform }}/preview-admission/forward.log
          .build/native-${{ matrix.platform }}/preview-admission/build/preview_admission .build/native-${{ matrix.platform }}/preview-admission/data --reverse | tee .build/native-${{ matrix.platform }}/preview-admission/reverse.log
      - name: Build matching Release symbols for optional Mac CPU profiling
        id: mac-profile-build
        if: always() && runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.mac_cpu_profile
        timeout-minutes: 10
        run: |
          set -euo pipefail
          profile_build="$PWD/.build/native-macos-arm64/cpu-profile-build"
          profile_evidence="$PWD/.build/native-macos-arm64/cpu-profile"
          mkdir -p "$profile_evidence/symbols"
          cmake -S gui_forms -B "$profile_build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG -g' \
            '-DCMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG -g' \
            '-DCMAKE_OBJCXX_FLAGS_RELEASE=-O3 -DNDEBUG -g' \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DGUI_FORMS_BUILD_GALLERY=OFF -DGUI_FORMS_BUILD_TESTS=ON \
            -DGUI_FORMS_ENABLE_MACOS_HOST=ON -DGUI_FORMS_ENABLE_WINDOWS_HOST=OFF -DGUI_FORMS_ENABLE_LINUX_HOST=OFF \
            -DGUI_FORMS_ENABLE_SKIA=ON -DGUI_FORMS_ENABLE_HARFBUZZ_TEXT=ON \
            -DGUI_FORMS_BUILD_PREPARED_TEXT=OFF -DGUI_FORMS_BUILD_TEXT_MASKS=OFF \
            -DGUI_FORMS_SKIA_PREBUILT=ON -DGUI_FORMS_SKIA_OUT="$PWD/.build/native-macos-arm64/skia" \
            2>&1 | tee "$profile_evidence/configure.log"
          cmake --build "$profile_build" --target gui_forms_macos_idle_visibility_tests --parallel 4 \
            2>&1 | tee "$profile_evidence/build.log"
          profile_app="$profile_build/gui_forms_macos_idle_visibility_tests.app"
          profile_executable="$profile_app/Contents/MacOS/gui_forms_macos_idle_visibility_tests"
          profile_symbols="$profile_evidence/symbols/gui_forms_macos_idle_visibility_tests.dSYM"
          xcrun dsymutil "$profile_executable" -o "$profile_symbols"
          xcrun dwarfdump --uuid "$profile_executable" > "$profile_evidence/symbols/executable-uuid.txt"
          xcrun dwarfdump --uuid "$profile_symbols" > "$profile_evidence/symbols/dsym-uuid.txt"
          test "$(awk '{print $2}' "$profile_evidence/symbols/executable-uuid.txt")" = "$(awk '{print $2}' "$profile_evidence/symbols/dsym-uuid.txt")"
          ditto "$profile_app" "$profile_evidence/symbols/gui_forms_macos_idle_visibility_tests.app"
          shasum -a 256 "$profile_executable" > "$profile_evidence/symbols/executable-sha256.txt"
      - name: Capture optional Mac CPU profiles and unprofiled controls
        if: always() && runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.mac_cpu_profile && steps.mac-profile-build.outcome == 'success'
        timeout-minutes: 20
        continue-on-error: true
        env:
          MAC_CPU_PROFILE_TEMPLATE: ${{ inputs.mac_cpu_profile_template }}
        run: |
          if [ "$MAC_CPU_PROFILE_TEMPLATE" = auto ] || [ -z "$MAC_CPU_PROFILE_TEMPLATE" ]; then
            python3 -B tools/run_macos_cpu_profile.py
          else
            python3 -B tools/run_macos_cpu_profile.py --template "$MAC_CPU_PROFILE_TEMPLATE"
          fi
      - name: Preserve optional Mac CPU profiles and matching symbols
        if: always() && runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.mac_cpu_profile
        uses: actions/upload-artifact@v4
        with:
          name: mac-cpu-profile-${{ github.run_id }}
          path: .build/native-macos-arm64/cpu-profile/
          include-hidden-files: true
          retention-days: 20
          if-no-files-found: warn
      - name: Save pinned dependency cache after build attempts
        if: always() && runner.os != 'Windows' && steps.native-dependencies.outputs.cache-primary-key != '' && steps.native-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            gui_forms/third_party/skia
            gui_forms/third_party/harfbuzz
            gui_forms/third_party/freetype
            .build/native-${{ matrix.platform }}/skia
          key: ${{ steps.native-dependencies.outputs.cache-primary-key }}
      - name: Report compiler cache statistics on macOS and Linux
        if: always() && runner.os != 'Windows'
        run: |
          ccache --show-stats --verbose
          mkdir -p .build/native-${{ matrix.platform }}
          ccache --print-stats > .build/native-${{ matrix.platform }}/compiler-cache-stats.txt
      - name: Report compiler cache statistics on Windows
        if: always() && runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ccache --show-stats --verbose
          mkdir -p .build/native-${{ matrix.platform }}
          ccache --print-stats > .build/native-${{ matrix.platform }}/compiler-cache-stats.txt
      - uses: actions/cache/save@v4
        if: always() && steps.objects.outputs.cache-primary-key != '' && steps.objects.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: ${{ steps.objects.outputs.cache-primary-key }}
      - name: Upload verified development archive
        uses: actions/upload-artifact@v4
        with:
          name: file-manager-${{ matrix.platform }}
          path: |
            .build/native-${{ matrix.platform }}/dist/*.zip
            .build/native-${{ matrix.platform }}/dist/*.tar.gz
            .build/native-${{ matrix.platform }}/dist/*.sha256
          if-no-files-found: error
      - name: Upload verified matching native SDKs
        uses: actions/upload-artifact@v4
        with:
          name: gui-forms-picker-sdk-${{ matrix.platform }}
          path: |
            .build/native-${{ matrix.platform }}/sdk-dist/*.zip
            .build/native-${{ matrix.platform }}/sdk-dist/*.sha256
          if-no-files-found: error
      - name: Preserve build/test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ matrix.platform }}
          path: |
            .build/native-${{ matrix.platform }}/**/Testing/Temporary/*LastTest.log
            .build/native-${{ matrix.platform }}/**/CMakeConfigureLog.yaml
            .build/native-${{ matrix.platform }}/compiler-cache-stats.txt
            .build/native-${{ matrix.platform }}/backend-consumption.json
            .build/native-${{ matrix.platform }}/package-check.json
            .build/native-${{ matrix.platform }}/source-state-*.json
            .build/native-${{ matrix.platform }}/paint-cost/*
            .build/native-${{ matrix.platform }}/focused-cpu/*
            .build/native-${{ matrix.platform }}/preview-admission/*.log
            .build/native-${{ matrix.platform }}/frontend/native-preview-failure.png
            .build/native-${{ matrix.platform }}/frontend/native-preview-failure.json
            .build/native-${{ matrix.platform }}/frontend/native-details.png
            .build/native-${{ matrix.platform }}/frontend/native-selection-facts.png
            .build/native-${{ matrix.platform }}/frontend/native-text-preview.png
            .build/native-${{ matrix.platform }}/frontend/native-image-preview.png
            .build/native-${{ matrix.platform }}/frontend/native-local-actions.png
          if-no-files-found: ignore
